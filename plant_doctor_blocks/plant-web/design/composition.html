<!doctype html>
<!-- Generated by design_blocks from the winning CompositionSpec.
     Geometry is verbatim from the resolved layout: the preview comp and
     this file cannot disagree. Principles embodied:
       - dominant mass anchors top-left with high-contrast green texture
       - organic irregular boundaries replace rigid grids to mimic cellular structure
       - diagnostic data pins directly onto the leaf anatomy rather than floating panels
       - vertical flow line carries the headline and progress stream down the left edge
       - density fills the entire canvas height with no empty bands

     Responsive contract: the composition IS the >=760px experience.
     Below 760px the canvas linearizes into reading order, decor-only
     depth elements disappear, and leader lines are not drawn — never
     scale-shrink a composition onto a phone.
-->
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Plant Doctor</title>
<link rel="stylesheet" href="design-theme.css" />
<style>
  .composition {
    position: relative;
    width: min(100%, 1440px);
    aspect-ratio: 1440 / 2722;
    margin: 0 auto;
    background: var(--design-bg);
    overflow: hidden;
  }
  .composition .el { position: absolute; display: flex; flex-direction: column; justify-content: center; padding: 1.2%; box-sizing: border-box; }
  .composition .el img, .composition .el svg.fill-media { width: 100%; height: 100%; object-fit: cover; border-radius: var(--design-radius); position: absolute; inset: 0; z-index: -1; }
  .composition .el.cutout img { object-fit: contain; border-radius: 0; }
  .composition .el.mask-circle img, .composition .el.mask-circle { border-radius: 50%; }
  .composition .surface-solid { background: var(--design-surface); border: 1px solid var(--design-border); border-radius: var(--design-radius); box-shadow: 0 12px 32px rgba(15,15,20,0.10); }
  .composition .surface-glass { background: color-mix(in srgb, var(--design-surface) 62%, transparent); backdrop-filter: blur(14px); border: 1px solid color-mix(in srgb, var(--design-surface) 70%, transparent); border-radius: var(--design-radius); }
  .composition .surface-outline { border: 2px solid var(--design-border); border-radius: var(--design-radius); }
  .composition h2 { margin: 0; font-family: var(--design-font-display); line-height: 1.05; letter-spacing: -0.02em; }
  .composition h2.fill { font-size: clamp(28px, 8vw, 150px); }
  .composition p { margin: 0.4em 0 0; color: var(--design-muted); font-size: 15px; }
  .composition .label { font-size: 11px; text-transform: uppercase; letter-spacing: 1.5px; color: var(--design-muted); }
  .composition .value { font-size: 28px; font-weight: 700; font-family: var(--design-font-display); }
  .composition ul { margin: 0.4em 0 0; padding-left: 1.1em; font-size: 14px; }
  .composition svg.viz { width: 100%; height: 100%; }
  .composition svg.leaders { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 60; pointer-events: none; }

  /* Below 760px the composition linearizes — reading order, no absolute
     geometry, no leader lines, no pure-depth decor. */
  @media (max-width: 760px) {
    .composition { aspect-ratio: auto; overflow: visible; padding: 12px 0 24px; }
    .composition .el {
      position: static; width: auto !important; height: auto !important;
      margin: 14px 5%; transform: none !important; min-height: 0;
    }
    .composition .el img, .composition .el svg.fill-media { position: static; height: auto; max-height: 320px; z-index: 0; }
    .composition .el.decor, .composition svg.leaders { display: none; }
    .composition h2.fill { font-size: clamp(40px, 13vw, 72px); }
  }
</style>
</head>
<body>
<main class="composition" aria-label="Plant Doctor">
  <!-- primary-subject -->
  <div class="el kind-image surface-solid cutout" data-id="leafSubject" data-role="primary-subject" style="left:-38.00%;top:-25.86%;width:100.00%;height:80.82%;z-index:8">
    <img src="hero.png" alt="macro closeup of a healthy green leaf with a single subtle brown necrotic spot, cellular texture visible, soft directional lighting casting deep shadows within the veins" />
  </div>
  <!-- navigation -->
  <div class="el kind-group surface-outline" data-id="nav-ghost" data-role="navigation" style="left:0.00%;top:0.00%;width:100.00%;height:2.42%;z-index:20">
    <ul><li>upload</li><li>history</li><li>settings</li></ul>
  </div>
  <!-- footer-text -->
  <div class="el kind-text surface-solid" data-id="footer-line" data-role="footer-text" style="left:0.00%;top:15.36%;width:100.00%;height:1.62%;z-index:11">
    <p>© 2024 Plant Doctor AI. Clinical diagnosis guidance.</p>
  </div>
  <!-- metric-annotation | attachedTo -->
  <div class="el kind-viz surface-solid" data-id="confidence-pin" data-role="metric-annotation" data-anchor-target="leafSubject" data-anchor-at="88,50" style="left:69.18%;top:26.63%;width:14.00%;height:8.08%;z-index:32">
  </div>
  <!-- spatial-condition | attachedTo -->
  <div class="el kind-viz surface-glass" data-id="anatomy-pin" data-role="spatial-condition" data-anchor-target="leafSubject" data-anchor-at="28,70" style="left:8.07%;top:42.03%;width:16.00%;height:9.70%;z-index:34">
    <svg class="viz" xmlns="http://www.w3.org/2000/svg" width="230" height="264" viewBox="0 0 230 264"><circle cx="115" cy="132" r="105" fill="none" stroke="#e4e4e7" stroke-width="16.8" opacity="0.5"/><path d="M 115.0 27.0 A 105 105 0 1 1 82.6 32.1" fill="none" stroke="#797e30" stroke-width="16.8" stroke-linecap="round"/></svg>
  </div>
  <!-- step-by-step-guide | attachedTo -->
  <div class="el kind-panel surface-solid" data-id="treatment-plan" data-role="step-by-step-guide" data-anchor-target="progress-stream" data-anchor-at="0,100" style="left:8.40%;top:47.27%;width:28.00%;height:36.37%;z-index:24">
    <ul><li>1. Remove affected leaf</li><li>2. Apply fungicide spray</li><li>3. Water lightly</li></ul>
  </div>
  <!-- diagnostic-progress | attachedTo -->
  <div class="el kind-viz surface-glass" data-id="progress-stream" data-role="diagnostic-progress" data-anchor-target="leafSubject" data-anchor-at="2,100" style="left:-6.00%;top:51.64%;width:12.00%;height:46.88%;z-index:25">
    <svg class="viz" xmlns="http://www.w3.org/2000/svg" width="173" height="1276" viewBox="0 0 173 1276"><path d="M 8.0 638.0 L 60.3 914.6 L 112.7 732.0 L 165.0 393.3" fill="none" stroke="#e4e4e7" stroke-width="2.5" stroke-dasharray="1 7" stroke-linecap="round"/><circle cx="8.0" cy="638.0" r="6" fill="#797e30"/><circle cx="60.3" cy="914.6" r="6" fill="#797e30"/><circle cx="112.7" cy="732.0" r="6" fill="#797e30"/><circle cx="165.0" cy="393.3" r="6" fill="#6b6f2a"/></svg>
  </div>
  <!-- headline-in-flow | attachedTo -->
  <div class="el kind-text surface-solid" data-id="headline-stream" data-role="headline-in-flow" data-anchor-target="leafSubject" data-anchor-at="0,100" style="left:-6.00%;top:67.08%;width:12.00%;height:11.32%;z-index:26">
    <h2 class="fill">Plant Doctor</h2>
    <p>drop a photo of a sick plant and an AI agent</p>
  </div>
  <!-- system-health | attachedTo -->
  <div class="el kind-viz surface-solid" data-id="agent-status" data-role="system-health" data-anchor-target="progress-stream" data-anchor-at="0,100" style="left:2.95%;top:70.87%;width:10.00%;height:6.47%;z-index:26">
    <svg class="viz" xmlns="http://www.w3.org/2000/svg" width="144" height="176" viewBox="0 0 144 176"><circle cx="72" cy="88" r="62" fill="none" stroke="#e4e4e7" stroke-width="9.92" opacity="0.5"/><path d="M 72.0 26.0 A 62 62 0 1 1 71.9 26.0" fill="none" stroke="#797e30" stroke-width="9.92" stroke-linecap="round"/></svg>
  </div>
  <!-- magnitude-indicator | attachedTo -->
  <div class="el kind-panel surface-solid" data-id="severity-badge" data-role="magnitude-indicator" data-anchor-target="progress-stream" data-anchor-at="0,100" style="left:-6.56%;top:73.55%;width:28.00%;height:14.55%;z-index:27">
    <h2 class="">Severity</h2>
    <span class="value">Low</span>
    <ul><li>Urgency: 2/10</li></ul>
  </div>
  <svg class="leaders" aria-hidden="true"></svg>
</main>
<script>
  // Leader lines drawn from LIVE geometry — annotations stay attached to
  // their anchors through any resize; skipped when the layout linearizes.
  (function () {
    var svg = document.querySelector('.composition svg.leaders');
    var canvas = document.querySelector('.composition');
    if (!svg || !canvas) return;
    function draw() {
      if (window.matchMedia('(max-width: 760px)').matches) { svg.innerHTML = ''; return; }
      var box = canvas.getBoundingClientRect();
      svg.setAttribute('viewBox', '0 0 ' + box.width + ' ' + box.height);
      var parts = [];
      document.querySelectorAll('[data-anchor-target]').forEach(function (el) {
        var target = document.querySelector('[data-id="' + el.getAttribute('data-anchor-target') + '"]');
        if (!target) return;
        var at = (el.getAttribute('data-anchor-at') || '50,50').split(',');
        var t = target.getBoundingClientRect();
        var s = el.getBoundingClientRect();
        var ax = t.left - box.left + (parseFloat(at[0]) / 100) * t.width;
        var ay = t.top - box.top + (parseFloat(at[1]) / 100) * t.height;
        var sx = s.left - box.left + s.width / 2;
        var sy = s.top - box.top + s.height / 2;
        parts.push('<line x1="' + ax + '" y1="' + ay + '" x2="' + sx + '" y2="' + sy + '" stroke="var(--design-primary-strong)" stroke-width="2" opacity="0.85"/>');
        parts.push('<circle cx="' + ax + '" cy="' + ay + '" r="5" fill="var(--design-primary-strong)"/>');
      });
      svg.innerHTML = parts.join('');
    }
    window.addEventListener('resize', draw);
    window.addEventListener('load', draw);
    draw();
  })();
</script>
</body>
</html>
